name: Windows MKL debug
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ['debug/windows_mkl']
    paths:
      - '.github/workflows/windows-mkl-debug.yml'
      - '.github/scripts/windows-mkl-debug/**'

concurrency:
  group: windows-mkl-debug-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l -e {0}

jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    strategy:
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
            numpy-build: "==2.0.*"
            numpy-run: "==1.26.*"
            scipy-run: "==1.17.*"
            qutip-optional: "[ipython,extras]"
            conda-extra-pkgs: '"pydiso>=0.3.1" "libblas=*=*mkl"'
            pypi-extra-pkgs: "matplotlib==3.9.* threadpoolctl pytest-timeout"
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        if: matrix.os != 'windows-11-arm'
        # Currently miniconda doesn't support window-11 arms
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge

      - name: Install pip
        if: matrix.os != 'windows-11-arm'
        shell: bash -l {0}
        run: conda install pip -y -n test

      # TODO remove this once conda supports windows arm
      - uses: actions/setup-python@v7
        if: matrix.os == 'windows-11-arm'
        with:
          python-version: ${{ matrix.python-version }}

      # Meson, unlike setuptools/distutils, does not locate and activate the
      # MSVC toolchain itself: it simply looks for cl.exe and link.exe in PATH.
      # This writes the result to GITHUB_ENV, so every later step inherits it.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}

      # Git for Windows ships a coreutils /usr/bin/link.exe,
      # and bash puts that directory ahead of the MSVC toolchain in PATH.
      # Deleting it same as what numpy, scipy do.
      - name: Remove GNU link.exe (shadows MSVC link.exe under bash)
        if: runner.os == 'Windows'
        run: rm -f /usr/bin/link.exe /usr/bin/link

      - name: Environment information
        run: |
          uname -a
          if [[ "ubuntu-latest" == "${{ matrix.os }}" ]]; then
              hostnamectl
              lscpu
              free -h
          fi

      - name: Build QuTiP wheel
        run: |
          cd ..  # Meson complain when the venv is in QuTiP's directory
          python -m venv build_env
          if [ "$RUNNER_OS" = "Windows" ]; then
            source ./build_env/Scripts/activate
          else
            source ./build_env/bin/activate
          fi
          cd qutip
          python -m pip install meson-python meson ninja # build
          python -m pip install "cython${{ matrix.cython-build }}"
          python -m pip install "numpy${{ matrix.numpy-build }}"
          python -m pip install "scipy${{ matrix.scipy-build }}"
          python -m pip wheel . --no-build-isolation --no-deps
          echo "Build environment:"
          pip list

      - name: Install QuTiP and dependencies
        working-directory: ${{ runner.temp }}
        env: # Use env var to avoid issue with embedded quotes
          CONDA_EXTRA_PKGS: ${{ matrix.conda-extra-pkgs }}
        run: |
          # Install the extra requirement
          python -m pip install pytest pytest-rerunfailures

          # CORE_DEP installed here, but add it at each step to force pip to
          # not update the versions at a later step.
          # ps. conda install after a pip install of the same version will
          # priorize the conda build. pip after the conda install will detect
          # it as already installed.

          CORE_DEP="numpy${{ matrix.numpy-run }} scipy${{ matrix.scipy-run }}"
          if [[ "${{ matrix.pypi }}" ]]; then
            pip install $CORE_DEP
          else
            conda install $CORE_DEP
          fi

          cp "${{ github.workspace }}"/qutip*.whl .
          WHEEL=$( echo qutip*.whl )
          echo $WHEEL

          python -m pip install "$WHEEL${{ matrix.qutip-optional }}" $CORE_DEP -v

          if [[ -n "${{ matrix.pypi-extra-pkgs }}" ]]; then
            python -m pip install ${{ matrix.pypi-extra-pkgs }} $CORE_DEP
          fi

          if [[ -n "$CONDA_EXTRA_PKGS" ]]; then
            conda install ${{ matrix.conda-extra-pkgs }} $CORE_DEP
          fi

      - name: Record environment
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p mkl-debug-logs
          conda list --explicit > mkl-debug-logs/conda-explicit.txt
          conda list > mkl-debug-logs/conda-list.txt
          python -m pip freeze > mkl-debug-logs/pip-freeze.txt
          python -c "import qutip; qutip.about(); print(qutip.settings)" | tee mkl-debug-logs/qutip.txt
          python -m threadpoolctl -i numpy scipy.linalg pydiso.mkl_solver | tee mkl-debug-logs/threadpools.txt

      # Both comparisons start fresh Python processes and run the same tests.
      # Continue after a timeout so both results and logs remain available.
      - name: PARDISO then tomography - default threads
        id: default_threads
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          python -u -c '
          import sys
          import pytest
          from pydiso.mkl_solver import get_mkl_max_threads, get_mkl_pardiso_max_threads
          print("MKL threads:", get_mkl_max_threads(), flush=True)
          print("PARDISO threads:", get_mkl_pardiso_max_threads(), flush=True)
          sys.exit(pytest.main(["-vv", "--timeout=120", "--timeout-method=thread",
                               "--pyargs", "qutip.tests.test_mkl", "qutip.tests.test_qpt"]))
          ' 2>&1 | tee mkl-debug-logs/default-threads.log

      - name: PARDISO then tomography - single thread
        id: single_thread
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        timeout-minutes: 5
        env:
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -o pipefail
          python -u -c '
          import sys
          import pytest
          from pydiso.mkl_solver import get_mkl_max_threads, get_mkl_pardiso_max_threads
          print("MKL threads:", get_mkl_max_threads(), flush=True)
          print("PARDISO threads:", get_mkl_pardiso_max_threads(), flush=True)
          sys.exit(pytest.main(["-vv", "--timeout=120", "--timeout-method=thread",
                               "--pyargs", "qutip.tests.test_mkl", "qutip.tests.test_qpt"]))
          ' 2>&1 | tee mkl-debug-logs/single-thread.log

      - name: PARDISO then tomography - PARDISO single thread only
        id: pardiso_single_thread
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          python -u -c '
          import sys
          import pytest
          from pydiso.mkl_solver import (
              get_mkl_max_threads, get_mkl_pardiso_max_threads,
              set_mkl_pardiso_threads,
          )
          original_mkl_threads = get_mkl_max_threads()
          set_mkl_pardiso_threads(1)
          print("MKL threads:", get_mkl_max_threads(), flush=True)
          print("PARDISO threads:", get_mkl_pardiso_max_threads(), flush=True)
          assert get_mkl_max_threads() == original_mkl_threads
          assert get_mkl_pardiso_max_threads() == 1
          sys.exit(pytest.main(["-vv", "--timeout=120", "--timeout-method=thread",
                               "--pyargs", "qutip.tests.test_mkl", "qutip.tests.test_qpt"]))
          ' 2>&1 | tee mkl-debug-logs/pardiso-single-thread.log

      - name: PARDISO default threads then tomography single thread
        id: tomography_single_thread
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          python -u -c '
          import sys
          import pytest
          from pydiso.mkl_solver import get_mkl_max_threads, set_mkl_threads

          class LimitTomographyThreads:
              switched = False

              def pytest_runtest_setup(self, item):
                  if item.module.__name__ == "qutip.tests.test_qpt" and not self.switched:
                      print("MKL threads before tomography:", get_mkl_max_threads(), flush=True)
                      set_mkl_threads(1)
                      print("MKL threads after limiting:", get_mkl_max_threads(), flush=True)
                      assert get_mkl_max_threads() == 1
                      self.switched = True

          print("Initial MKL threads:", get_mkl_max_threads(), flush=True)
          sys.exit(pytest.main(["-vv", "--capture=tee-sys", "--timeout=120",
                               "--timeout-method=thread", "--pyargs",
                               "qutip.tests.test_mkl", "qutip.tests.test_qpt"],
                              plugins=[LimitTomographyThreads()]))
          ' 2>&1 | tee mkl-debug-logs/tomography-single-thread.log

      - name: Summarize threading comparison
        if: always()
        env:
          DEFAULT_OUTCOME: ${{ steps.default_threads.outcome }}
          SINGLE_OUTCOME: ${{ steps.single_thread.outcome }}
          PARDISO_OUTCOME: ${{ steps.pardiso_single_thread.outcome }}
          TOMOGRAPHY_OUTCOME: ${{ steps.tomography_single_thread.outcome }}
        run: |
          {
            echo '| Thread configuration | Result |'
            echo '| --- | --- |'
            echo "| Default | $DEFAULT_OUTCOME |"
            echo "| MKL_NUM_THREADS=1, OMP_NUM_THREADS=1 | $SINGLE_OUTCOME |"
            echo "| PARDISO threads=1 only | $PARDISO_OUTCOME |"
            echo "| Default PARDISO, MKL threads=1 before tomography | $TOMOGRAPHY_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$DEFAULT_OUTCOME" = success && test "$SINGLE_OUTCOME" = success && test "$PARDISO_OUTCOME" = success
          test "$TOMOGRAPHY_OUTCOME" = success

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-mkl-debug-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mkl-debug-logs
          if-no-files-found: warn
